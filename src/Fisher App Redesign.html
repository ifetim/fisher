<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fisher — Responsive App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fisher-web.css">
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="fisher-dashboard.jsx"></script>
<script type="text/babel" src="fisher-spending.jsx"></script>
<script type="text/babel" src="fisher-savings-advice.jsx"></script>

<script type="text/babel">
const { useState } = React;

const navIcons = {
  dashboard: (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9.5L12 3l9 6.5V20a2 2 0 01-2 2h-4v-7H10v7H6a2 2 0 01-2-2V9.5z"/></svg>
  ),
  spending: (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><line x1="2" y1="11" x2="22" y2="11"/></svg>
  ),
  savings: (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4.5L6 21l1.5-7.5L2 9h7z"/></svg>
  ),
  advice: (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7c0 .8.5 1.3 1 1.3h6c.5 0 1-.5 1-1.3A7 7 0 0012 2z"/></svg>
  ),
};

const navItems = [
  { id: 'dashboard', label: 'Dashboard' },
  { id: 'spending',  label: 'Spending'  },
  { id: 'savings',   label: 'Savings'   },
  { id: 'advice',    label: 'Advice'    },
];

function Sidebar({ active, onNavigate }) {
  return (
    <aside className="sidebar">
      <div className="sidebar-brand">
        <div className="sidebar-brand-logo">F</div>
        <div className="sidebar-brand-name">Fisher</div>
      </div>
      {navItems.map(it => (
        <button key={it.id} className={'sidebar-item' + (active === it.id ? ' active' : '')} onClick={() => onNavigate(it.id)}>
          {navIcons[it.id]}
          <span>{it.label}</span>
        </button>
      ))}
      <div className="sidebar-foot">
        <div className="avatar">A</div>
        <div className="info">
          <p className="name">Alex Chen</p>
          <p className="sub">Free plan</p>
        </div>
      </div>
    </aside>
  );
}

function BottomNav({ active, onNavigate }) {
  return (
    <nav className="bnav">
      {navItems.map(it => (
        <button key={it.id} className={'bnav-item' + (active === it.id ? ' active' : '')} onClick={() => onNavigate(it.id)}>
          {navIcons[it.id]}
          <span>{it.label}</span>
        </button>
      ))}
    </nav>
  );
}

function App() {
  const [active, setActive] = useState('dashboard');
  const [visible, setVisible] = useState(true);
  const [connected, setConnected] = useState(false);

  let body;
  if (active === 'dashboard') body = <DashboardScreen visible={visible} toggleVisible={() => setVisible(v => !v)} />;
  else if (active === 'spending') body = <SpendingScreen connected={connected} onConnect={() => setConnected(true)} />;
  else if (active === 'savings') body = <SavingsScreen />;
  else body = <AdviceScreen />;

  return (
    <div className="app">
      <Sidebar active={active} onNavigate={setActive} />
      <main className="main">
        <div className="main-inner">{body}</div>
      </main>
      <BottomNav active={active} onNavigate={setActive} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
